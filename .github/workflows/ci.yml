name: CI — ParkVektor Private DE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install backend dependencies
        run: uv sync --python 3.12
      - name: Lint (ruff)
        run: uv run --no-sync ruff check app tests
      - name: Test (pytest)
        run: uv run --no-sync pytest -v

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install edge dependencies
        run: uv sync --python 3.12
      - name: Lint (ruff)
        run: uv run --no-sync ruff check pipeline plates sync scripts tests cli.py
      - name: Test (pytest)
        run: uv run --no-sync pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
